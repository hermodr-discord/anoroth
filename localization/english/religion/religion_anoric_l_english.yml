 anorath_adherent_plural:0 "Anóraths"
 anorath_desc:0 "Codified in 3A 6 by the great decree of Emperor Agrás 'the Sun King', the Anórath faith was forged from the disparate ancient beliefs of the Anorothic Empire into a singular devotion to Anór, Firstborn of the Gods. As the divine embodiment of the Sun and War, Anór's worship became inextricably linked to the Empire's identity and purpose. From this point, the Anōrath faith served as the guiding light and justification for imperial authority, cultural dominance, and the relentless expansion of the Empire across Anáthis."
