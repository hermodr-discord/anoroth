 ### Agalrian Religions
 agalrian_religion:0 "Agalrian"
 agalrian_religion_adj:0 "Agalrian"
 agalrian_religion_adherent:0 "Agalrian"
 agalrian_religion_adherent_plural:0 "Agalrians"
 agalrian_religion_desc:0 "The Agalrian faiths hold that land, sky, and the dead are alive with spirit, owed honor as kin rather than worship as rulers. Rites are local, oral, and communal, kept at groves and mounds rather than temple and scripture, carried forward by memory as much as by belief."

