 ### Gaileth
 faith_gaileth:0 "Gaileth"
 faith_gaileth_adj:0 "Gaileth"
 faith_gaileth_adherent:0 "Gaileth"
 faith_gaileth_adherent_plural:0 "Gaileths"
 faith_gaileth_desc:0 "The Gaileth hold that the land, sky, and dead alike are alive with spirit and kin to those that tend them, the Senocenti owed honor in their season and place rather than worship in some distant temple. No single power rules the others; Toranos and Andarta stand foremost as Sky-Father and Earth-Mother, but even they are kin among kin, not sovereigns. To neglect the old rites is to invite misfortune upon the land itself, to keep them faithfully is to be kept in turn."