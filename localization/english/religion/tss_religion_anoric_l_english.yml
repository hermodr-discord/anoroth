 ### Anórath
 faith_anorath:0 "Anórath"
 faith_anorath_adj:0 "Anórath"
 faith_anorath_adherent:0 "Anórath"
 faith_anorath_adherent_plural:0 "Anóraths"
 faith_anorath_desc:0 "Codified in 3A 42 by the great decree of Calyreos Agrás 'the Sun King' Anómar, the Anórath faith was forged from the disparate and ancient beliefs of the Anórothil peoples into a singular devotion to Anór, All-King, Firstborn of the Gods. The Anórath Church holds that Anór is not merely first among the Gods, but their rightful sovereign, with the rest of the Pantheon honored as noble kin subordinate to His will. The Sun is regarded as the literal seat of divine power, and law is treated as an extension of that same authority, to defy the crown's law is the defy Anór himself. Worship favors open skies over enclosed buildings, and its highest clergy surrender their sight to the Sun as proof of devotion."

 faith_anorath_religious_head_male:0 "Calyreos"
 faith_anorath_religious_head_female:0 "Calyreos"

 faith_anorath_devotee:0 "anórath"
 faith_anorath_devotee_plural:0 "anóraths"

 ### Anórcastos
 faith_anorcastos:0 "Anórcastos"
 faith_anorcastos_adj:0 "Anórcastan"
 faith_anorcastos_adherent:0 "Anórcasten"
 faith_anorcastos_adherent_plural:0 "Anórcastenes"
 faith_anorcastos_desc:0 "The Anórcastos Church splintered from the Imperial Anórath Church in 3A 2914 in the wake of the Anórath Reforms set forth by Calyreos Valeron II Argyrian, viewing the Calyreos's reforms to have strayed from the intended path of Anór, though they still nominally recognize the Calyreos as the Voice of Anór in the mortal world. The Anórcastenes allow no accomodation for the wider Pantheon, holding Anór as the only power worth worship, all others dismissed as servants, fictions, or distractions from true devotion. They scorn the compromises and modifications to the Sun King's original Church, prizing zealotry and harship as marks of sincerity rather than excess."

 faith_anorcastos_religious_text:0 "Codices of the Sun-King"
 faith_anorcastos_religious_text_2:0 "Themaran Creed" # Optional translation alt
 faith_anorcastos_religious_text_3:0 "Decree of the Pylarchs" # Optional translation alt

 faith_anorcastos_devotee:0 "anórcastos"
 faith_anorcastos_devotee_plural:0 "anórcastenes"

 ### Sobranorye
 faith_sobranorye:0 "Sobranorye"
 faith_sobranorye_adj:0 "Sobranorye"
 faith_sobranorye_adherent:0 "Sobranorye"
 faith_sobranorye_adherent_plural:0 "Sobranorye"
 faith_sobranorye_desc:0 "The Sobranorye faith holds the Sun and Moon as equal and interdependent powers, each incomplete without the other. Anór's fire tempered by Patharán's restraint, war balanced by peace. Its rites come in mirrored pairs, a rite of daylight answered by a rite of moonlight, and its clergy walk in pairs aswell, one voice speaking for each God. The faith emerged as the highly Anór-worshipping ruling elite intermarried and interweaved with the local Beron-worshipping Behatyn populace."

