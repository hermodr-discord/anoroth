 ### Anoric Religions
 anoric_religion:0 "Anóric"
 anoric_religion_adj:0 "Anóric"
 anoric_religion_adherent:0 "Anóric"
 anoric_religion_adherent_plural:0 "Anórics"
 anoric_religion_desc:0 "The Anóric faiths are a loose family of creeds bound only by a shared belief: that Anór, whatever name he wears in a given land, sits above all other powers as the true Lord of the Sun and Lord of War. Some accept the wider Pantheon as lesser kin of their God, other deny the other Gods any legitimacy at all. Wherever the Sun is called a throne and war called sacred, the hand of Anór is said to be at work, even where his true name has been long forgotten."

