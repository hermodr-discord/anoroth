 ### Funéthresca
 faith_funethresca:0 "Funéthresca"
 faith_funethresca_adj:0 "Funéthresca"
 faith_funethresca_adherent:0 "Funéthresca"
 faith_funethresca_adherent_plural:0 "Funéthresces"
 faith_funethresca_desc:0 "Founded from the mixing of Vanás-worshipping Tharun settlers and the local Anórath populace, the Funéthresca holds Anór above all else, yet have never let the sea slip from memory. Vanás remains honored as a power owed respect, and Anór's fire is spoken of as having made an uneasy peace with the tides. Doctrine and hierarchy alike are drawn from the Anórath Church, but its rites and people always keep one foot in the seas, sailors and farmers alike know better than to leave the tide unappeased."

