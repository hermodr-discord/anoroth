 ### Anatzeve
 faith_anatzeve:0 "Anatzeve"
 faith_anatzeve_adj:0 "Anatzeve"
 faith_anatzeve_adherent:0 "Anatzeve"
 faith_anatzeve_adherent_plural:0 "Anatzeves"
 faith_anatzeve_desc:0 "The Anatzeve hold to the same core conviction as Anórath, that Onor sits above all else as Lord of the Sun and Lord of War. Outwardly its doctrine mirrors Anórath in nearly every way; beneath it, the hearth-rites and ancestral customs of the Larrunic people continue much as they did before the Empire stepped foot in their lands. To be Anatzeve is not to set aside the ways of one's forebears for the God of one's conquerors, but to carry both beneath the same roof."

