 ### Hélyv Religions
 helyv_religion:0 "Hélyv"
 helyv_religion_adj:0 "Hélyv"
 helyv_religion_adherent:0 "Hélyv"
 helyv_religion_adherent_plural:0 "Hélyvok"
 helyv_religion_desc:0 "The Hélyv faiths share one root belief in that the land is alive with spirit, owed honor as home and protectors rather than claimed as conquest. East of the Veil, this turns to sky and open steppe, while within the mountains it turns to stone and storm. Beyond that, each Hélyv faith is shaped by the land that raised it."

