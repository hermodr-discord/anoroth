 ### Oszeseg
 faith_oszeseg:0 "Oszeseg"
 faith_oszeseg_adj:0 "Oszeseg"
 faith_oszeseg_adherent:0 "Oszeseg"
 faith_oszeseg_adherent_plural:0 "Oszesegs"
 faith_oszeseg_desc:0 "The Oszeseg teachings hold that the mountains are a living hierarchy of spirits, from the lowest spring to the highest summit, each owed its due respect. To take from the mountain without offering in return, to boast too loudly, or to turn a traveler from the hearth is to invite its wrath, but a people who endure its hardships and honor its spirits are granted its lasting protection. Hospitality, patience, and endurance are held above nearly all else, virtues carved into the faith by the same peaks its people call home."
