 ### Icáthavrel
 faith_icathavrel:0 "Icáthavrel"
 faith_icathavrel_adj:0 "Icáthavrel"
 faith_icathavrel_adherent:0 "Icáthavrel"
 faith_icathavrel_adherent_plural:0 "Icáthavreles"
 faith_icathavrel_desc:0 "The Icáthavrel hold that Icáthos alone is real, and that every other god, every other faith, is a mask worn to hide a single truth mortals refuse to face. Nowhere is that refusal more complete, in the eyes of the faithful, than within the Anorothic Empire itself. A realm built in sole service to a God, built for the sole purpose of divine favor, and therefore the deepest lie yet told. To the Icáthavrel, the Empire's ruin is necessary for the truth to be revealed, and its unmaking is treated as the truest religious act there is."
 
