 icanic_religion_adj:0 "Icánic"
 icanic_religion_adherent:0 "Icánic"
 icanic_religion_adherent_plural:0 "Icánics"
 icanic_religion_desc:0 "The Icánic faiths all coalesce around the belief that Icáthos, the embodiment of Fear, Dread, and Suffering, underlies all things. Some hold it as one truth among many to be respected; others hold it as the only truth, and every other doctrine a comforting lie built to hide it. In those places where suffering is named sacred rather than shameful, an Icánic faith has taken root."

