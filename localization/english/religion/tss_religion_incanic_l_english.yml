 ### Telasatz
 faith_telasatz:0 "Telasatz"
 faith_telasatz_adj:0 "Telasatz"
 faith_telasatz_adherent:0 "Telasatz"
 faith_telasatz_adherent_plural:0 "Telasatzak"
 faith_telasatz_desc:0 "The Telasatz hold Enkat as first among the Pantheon, kin to the other Gods rather than their sovereign. Smithing is treated as sacred work, storms welcomed as Enkat's own voice, and worship favors open, wind-struck heights over sheltered stone. To master the hammer is, in its own way, to become closer to the God."

