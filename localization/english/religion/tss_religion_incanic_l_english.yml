 ### Incánic Religions
 incanic_religion:0 "Incánic"
 incanic_religion_adj:0 "Incánic"
 incanic_religion_adherent:0 "Incánic"
 incanic_religion_adherent_plural:0 "Incánics"
 incanic_religion_desc:0 "The Incánic faiths are those faiths that venerate Incánas, the Forgemaster, the Thunderer, or however he is named, as foremost among the Gods. Some hold him first among equals, kin to the wider Pantheon rather than ruler over it; others may set him higher still. Wherever storms are worshipped and forges revered, an Incánic faith may well be close at hand."

