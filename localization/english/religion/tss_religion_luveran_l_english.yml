 ### Isanara
 faith_isanara:0 "Isanara"
 faith_isanara_adj:0 "Isanaran"
 faith_isanara_adherent:0 "Isanaran"
 faith_isanara_adherent_plural:0 "Isanarans"
 faith_isanara_desc:0 "The Isanara worship Isana, She of the Ocean and the Wind, as well as the uncountable spirits that serve Her spread across the world. The honored dead are not forgotten but carried onward, remembered alongside the living and welcomed into Isana's own embrace if their life was lived well. Newcomers are rarely turned away, like the tide itself, Isanara draws in what drifts toward it and folds it into the whole, so long as it is willing to move as one with the rest."
