### Luveran Religions
 luveran_religion:0 "Luveran"
 luveran_religion_adj:0 "Luveran"
 luveran_religion_adherent:0 "Luveran"
 luveran_religion_adherent_plural:0 "Luverans"
 luveran_religion_desc:0 "The Luveran faiths see the sea as a living force, one to be read, respected, and moved with rather than against. Ancestors are honored as just as much a part of the community as they were in life, their memory carried in the same tides their descendants now sail. Belief here is rarely solitary, to worship is to belong, and to belong is to rise and fall with one's kin as a single body of water."

