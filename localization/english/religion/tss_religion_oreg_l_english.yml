 ### Oreg Religions
 oreg_religion:0 "Oreg"
 oreg_religion_adj:0 "Oreg"
 oreg_religion_adherent:0 "Oreg"
 oreg_religion_adherent_plural:0 "Oreges"
 oreg_religion_desc:0 "The Oreg faiths worship no god apart from the land itself, the Great Marsh seen not as a place where a spirit dwells, but as the spirit itself, alive and whole. Where other faiths honor many powers or one power among many, an Oreg faith recognizes no functional division between land and divinity, to live rightly within the Marsh is the entirety of devotion, and to protect the Marsh is the entirety of duty."

