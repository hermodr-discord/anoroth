 ### Ilg e-Garna
 faith_ilg_e_garna:0 "Ilg e-Garna"
 faith_ilg_e_garna_adj:0 "Ilg e-Garna"
 faith_ilg_e_garna_adherent:0 "Oreg e-Garna"
 faith_ilg_e_garna_adherent_plural:0 "Oreges e-Garna"
 faith_ilg_e_garna_desc:0 "The Ilg e-Garna is the way of the Marsh, worshipping Garna, the Great Marsh, as a god in itself. The Oreg are less worshippers so much as they are its own children, born of its mud and owed back to it in death. To defend the Marsh from outside hands is simple duty, and to live carefully in its waters is all the devotion necessary. The Ilg e-Garna asks nothing more than to be left alone within what has always been."

 faith_ilg_e_garna_devotee:0 "devotee"
 faith_ilg_e_garna_devotee_plural:0 "devotees"