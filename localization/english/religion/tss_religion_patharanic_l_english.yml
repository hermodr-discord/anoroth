 patharanic_religion_adherent_plural:0 "Patharánics"
 patharanic_religion_desc:0 "The Patharánic faiths share one core conviction in that Patharán, whatever name he wears in a given land, stands above all other powers as the greatest measure of divine order, the true Lord of the Moon. Patience, stillness, and harmony are among those traits most favored by these believers. Wherever peace is venerated and the Moon named a throne, a Patharánic faith is surely close at hand."

