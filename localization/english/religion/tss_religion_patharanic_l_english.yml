 ### Beronovy
 faith_beronovy:0 "Beronovy"
 faith_beronovy_adj:0 "Beronovy"
 faith_beronovy_adherent:0 "Beroneskiy"
 faith_beronovy_adherent_plural:0 "Beroneskiya"
 faith_beronovy_desc:0 "The Beronovy Church holds Beron, Lord of the Moon and Father of Peace, supreme over the Pantheon. The other Gods are honored as his kin, and conflict itself held to be a failure of harmony rather than proof of strength. Clergy serve as often as mediators as ministers, called upon to settle disputes before they are ever allowed to become conflicts at all. To live peacefully is, in itself, considered the truest devotion Beron asks of his faithful."

