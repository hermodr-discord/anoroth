 ### Toqārut
 faith_toqarut:0 "Toqārut"
 faith_toqarut_adj:0 "Toqārut"
 faith_toqarut_adherent:0 "Toqārut"
 faith_toqarut_adherent_plural:0 "Toqāruts"
 faith_toqarut_desc:0 "Carried across generations by the great trading empires that have long commanded the Golden Strait, the Toqārut religion worships Toqāra, Lady of Fortune, above all other Gods, the rest of the Pantheon acknowledged but rarely called upon. Profits gained are treated as the clearest sign of Her favor there is, and piety is expressed daily in the marketplace as much as in temples, and neither class nor gender weighs against the faithful so long as they deal shrewdly and profit well. Conflict is regarded as poor investment, the wise faithful let coin, contract, and hired sword accomplish what open war would only make costly."

