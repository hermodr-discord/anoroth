 tagaric_religion_adherent_plural:0 "Tagárics"
 tagaric_religion_desc:0 "The Tagáric faiths are bound by their veneration of the Lady of Wealth and Fortune, however she is named, who rewards prosperity and wealth above all else. Piety is measured less in ritual or conquest than in what the faithful build, trade, and leave behind. In those places where profit is named sacred and wealth is called pious, a Tagáric faith has likely taken root."

