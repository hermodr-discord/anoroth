 ### Rónarvir
 faith_ronarvir:0 "Rónarvir"
 faith_ronarvir_adj:0 "Rónarvir"
 faith_ronarvir_adherent:0 "Rónarvir"
 faith_ronarvir_adherent_plural:0 "Rónarvirar"
 faith_ronarvir_desc:0 "The Rónarvir believe that the Father of the Sea, Vánnar, rules above all else. The wider Pantheon are his lesser kin, honored though they are subservient to His will and power. The sea gives as freely as it takes, the Lord of Tides being a temperamental and easily displeased God, a good catch, a safe voyage, or a sudden storm are all signs of Vánnar's judgement in equal measure. To brave the sea in any form, be it in trade, in raid, or in survival, is itself an act of devotion."

